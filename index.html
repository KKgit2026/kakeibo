<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: #111827;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 12px 32px;
}

h1 {
  margin: 4px 0 16px;
  text-align: center;
  font-size: 25px;
}

/* 月切り替え */
.month-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.month-button {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 10px;
  background: #1f2937;
  color: #fff;
  font-size: 22px;
}

.month-title {
  flex: 1;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

/* 合計 */
.summary {
  padding: 18px;
  margin-bottom: 12px;
  border-radius: 16px;
  background: #1f2937;
  text-align: center;
}

.summary-label {
  color: #9ca3af;
  font-size: 13px;
}

.summary-amount {
  margin-top: 4px;
  font-size: 31px;
  font-weight: bold;
}

/* カテゴリ集計 */
.category-summary {
  margin-bottom: 12px;
  padding: 15px;
  border-radius: 16px;
  background: #1f2937;
}

.section-title {
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: bold;
}

.category-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid #374151;
  font-size: 14px;
}

.category-row:last-child {
  border-bottom: none;
}

/* 入力 */
.form {
  margin-bottom: 12px;
  padding: 16px;
  border-radius: 16px;
  background: #1f2937;
}

.field {
  margin-bottom: 10px;
}

.field label {
  display: block;
  margin-bottom: 4px;
  color: #9ca3af;
  font-size: 12px;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #374151;
  border-radius: 10px;
  outline: none;
  background: #111827;
  color: #fff;
  font-size: 16px;
}

input:focus,
select:focus {
  border-color: #3b82f6;
}

.add-button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
}

.cancel-button {
  display: none;
  width: 100%;
  margin-top: 8px;
  padding: 11px;
  border: none;
  border-radius: 10px;
  background: #374151;
  color: #fff;
  font-size: 15px;
}

/* 保存表示 */
.save-status {
  min-height: 18px;
  margin-top: 8px;
  color: #6ee7b7;
  font-size: 12px;
  text-align: center;
}

/* 検索 */
.filter-box {
  margin-bottom: 12px;
  padding: 14px;
  border-radius: 16px;
  background: #1f2937;
}

.filter-row {
  display: flex;
  gap: 8px;
}

.filter-row input {
  flex: 1;
}

.filter-row select {
  width: 120px;
}

/* 一覧 */
.list {
  padding: 16px;
  border-radius: 16px;
  background: #1f2937;
}

.expense {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 0;
  border-bottom: 1px solid #374151;
}

.expense:last-child {
  border-bottom: none;
}

.expense-info {
  flex: 1;
  min-width: 0;
}

.expense-category {
  font-size: 14px;
  font-weight: bold;
}

.expense-detail {
  margin-top: 3px;
  color: #9ca3af;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.expense-amount {
  font-size: 15px;
  font-weight: bold;
  white-space: nowrap;
}

.action-button {
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: #374151;
  color: #fff;
  font-size: 14px;
}

.delete-button {
  color: #fca5a5;
}

.empty {
  padding: 24px 10px;
  color: #9ca3af;
  text-align: center;
  font-size: 13px;
}

.count {
  margin-top: 10px;
  color: #9ca3af;
  text-align: right;
  font-size: 11px;
}

@media (max-width: 380px) {
  .app {
    padding: 12px 9px 25px;
  }

  .filter-row select {
    width: 105px;
  }

  .summary-amount {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>💰 家計簿</h1>

  <div class="month-bar">
    <button class="month-button" id="prevMonth">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="month-button" id="nextMonth">›</button>
  </div>

  <div class="summary">
    <div class="summary-label">表示中の月の支出</div>
    <div class="summary-amount" id="total">¥0</div>
  </div>

  <div class="category-summary">
    <div class="section-title">📊 カテゴリ別</div>
    <div id="categorySummary"></div>
  </div>

  <div class="form">

    <div class="section-title" id="formTitle">
      支出を追加
    </div>

    <div class="field">
      <label>金額</label>
      <input id="amount" type="number" inputmode="numeric" placeholder="例：1280">
    </div>

    <div class="field">
      <label>カテゴリ</label>
      <select id="category">
        <option value="食費">🍚 食費</option>
        <option value="日用品">🛒 日用品</option>
        <option value="交通費">🚃 交通費</option>
        <option value="趣味">🎮 趣味</option>
        <option value="光熱費">💡 光熱費</option>
        <option value="通信費">📱 通信費</option>
        <option value="その他">📦 その他</option>
      </select>
    </div>

    <div class="field">
      <label>日付</label>
      <input id="date" type="date">
    </div>

    <div class="field">
      <label>メモ</label>
      <input id="memo" type="text" placeholder="例：スーパー">
    </div>

    <button class="add-button" id="addButton">
      ＋ 支出を追加
    </button>

    <button class="cancel-button" id="cancelButton">
      編集をキャンセル
    </button>

    <div class="save-status" id="saveStatus"></div>
  </div>

  <div class="filter-box">

    <div class="section-title">🔎 検索・絞り込み</div>

    <div class="filter-row">

      <input
        id="search"
        type="search"
        placeholder="メモやカテゴリを検索"
      >

      <select id="filterCategory">
        <option value="すべて">すべて</option>
        <option value="食費">食費</option>
        <option value="日用品">日用品</option>
        <option value="交通費">交通費</option>
        <option value="趣味">趣味</option>
        <option value="光熱費">光熱費</option>
        <option value="通信費">通信費</option>
        <option value="その他">その他</option>
      </select>

    </div>
  </div>

  <div class="list">

    <div class="section-title">📋 支出一覧</div>

    <div id="expenseList"></div>

    <div class="count" id="count"></div>

  </div>

</div>

<script>

const STORAGE_KEY = "myHouseholdExpenses";

const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");
const dateInput = document.getElementById("date");
const memoInput = document.getElementById("memo");

const addButton = document.getElementById("addButton");
const cancelButton = document.getElementById("cancelButton");

const expenseList = document.getElementById("expenseList");
const totalElement = document.getElementById("total");
const categorySummary = document.getElementById("categorySummary");
const saveStatus = document.getElementById("saveStatus");
const countElement = document.getElementById("count");

const monthTitle = document.getElementById("monthTitle");
const prevMonth = document.getElementById("prevMonth");
const nextMonth = document.getElementById("nextMonth");

const searchInput = document.getElementById("search");
const filterCategory = document.getElementById("filterCategory");

let expenses = JSON.parse(
  localStorage.getItem(STORAGE_KEY)
) || [];

let selectedMonth = new Date();
let editingId = null;

const categories = [
  "食費",
  "日用品",
  "交通費",
  "趣味",
  "光熱費",
  "通信費",
  "その他"
];

function formatYen(value) {
  return "¥" + Number(value).toLocaleString("ja-JP");
}

function getTodayString() {
  const d = new Date();

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(d.getDate()).padStart(2, "0")
  );
}

dateInput.value = getTodayString();

function saveExpenses() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(expenses)
  );

  saveStatus.textContent =
    `✓ 自動保存しました　保存データ：${expenses.length}件`;

  setTimeout(() => {
    saveStatus.textContent = "";
  }, 2500);
}

function getMonthKey(date) {

  const d = new Date(date);

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2, "0")
  );
}

function getSelectedMonthKey() {

  return (
    selectedMonth.getFullYear() +
    "-" +
    String(selectedMonth.getMonth() + 1).padStart(2, "0")
  );
}

function updateMonthTitle() {

  monthTitle.textContent =
    `${selectedMonth.getFullYear()}年${selectedMonth.getMonth() + 1}月`;

}

function getMonthExpenses() {

  const key = getSelectedMonthKey();

  return expenses.filter(
    expense =>
      getMonthKey(expense.date) === key
  );
}

function updateTotal() {

  const monthExpenses =
    getMonthExpenses();

  const total =
    monthExpenses.reduce(
      (sum, expense) =>
        sum + Number(expense.amount),
      0
    );

  totalElement.textContent =
    formatYen(total);
}

function updateCategorySummary() {

  const monthExpenses =
    getMonthExpenses();

  categorySummary.innerHTML = "";

  const totals = {};

  categories.forEach(category => {
    totals[category] = 0;
  });

  monthExpenses.forEach(expense => {

    if (totals[expense.category] !== undefined) {
      totals[expense.category] +=
        Number(expense.amount);
    }

  });

  const usedCategories =
    categories.filter(
      category =>
        totals[category] > 0
    );

  if (usedCategories.length === 0) {

    categorySummary.innerHTML =
      `<div class="empty">
        この月の支出はありません
      </div>`;

    return;
  }

  usedCategories.forEach(category => {

    const row =
      document.createElement("div");

    row.className =
      "category-row";

    row.innerHTML =
      `<span>${category}</span>
       <strong>${formatYen(totals[category])}</strong>`;

    categorySummary.appendChild(row);

  });
}

function getFilteredExpenses() {

  let list =
    getMonthExpenses();

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const selectedCategory =
    filterCategory.value;

  if (search) {

    list = list.filter(expense => {

      const text =
        (
          expense.category +
          " " +
          expense.memo +
          " " +
          expense.date
        ).toLowerCase();

      return text.includes(search);

    });

  }

  if (
    selectedCategory !== "すべて"
  ) {

    list = list.filter(
      expense =>
        expense.category ===
        selectedCategory
    );

  }

  return list.sort(
    (a, b) =>
      b.date.localeCompare(a.date) ||
      b.id - a.id
  );
}

function renderExpenses() {

  expenseList.innerHTML = "";

  const list =
    getFilteredExpenses();

  if (list.length === 0) {

    expenseList.innerHTML =
      `<div class="empty">
        該当する支出はありません
      </div>`;

  }

  list.forEach(expense => {

    const item =
      document.createElement("div");

    item.className = "expense";

    const info =
      document.createElement("div");

    info.className =
      "expense-info";

    const category =
      document.createElement("div");

    category.className =
      "expense-category";

    category.textContent =
      expense.category;

    const detail =
      document.createElement("div");

    detail.className =
      "expense-detail";

    detail.textContent =
      expense.date +
      (
        expense.memo
          ? "　" + expense.memo
          : ""
      );

    info.appendChild(category);
    info.appendChild(detail);

    const amount =
      document.createElement("div");

    amount.className =
      "expense-amount";

    amount.textContent =
      formatYen(expense.amount);

    const editButton =
      document.createElement("button");

    editButton.className =
      "action-button";

    editButton.textContent =
      "✏️";

    editButton.addEventListener(
      "click",
      () => startEdit(expense.id)
    );

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "action-button delete-button";

    deleteButton.textContent =
      "🗑️";

    deleteButton.addEventListener(
      "click",
      () => deleteExpense(expense.id)
    );

    item.appendChild(info);
    item.appendChild(amount);
    item.appendChild(editButton);
    item.appendChild(deleteButton);

    expenseList.appendChild(item);

  });

  countElement.textContent =
    `${list.length}件表示 / 保存データ ${expenses.length}件`;

  updateTotal();
  updateCategorySummary();
  updateMonthTitle();
}

function addExpense() {

  const amount =
    Number(amountInput.value);

  if (!amount || amount <= 0) {

    alert("金額を入力してください");

    amountInput.focus();

    return;
  }

  if (!dateInput.value) {

    alert("日付を入力してください");

    return;
  }

  if (editingId !== null) {

    const expense =
      expenses.find(
        e => e.id === editingId
      );

    if (expense) {

      expense.amount = amount;
      expense.category =
        categoryInput.value;
      expense.date =
        dateInput.value;
      expense.memo =
        memoInput.value.trim();

    }

    editingId = null;

    addButton.textContent =
      "＋ 支出を追加";

    cancelButton.style.display =
      "none";

  } else {

    expenses.push({

      id: Date.now(),

      amount: amount,

      category:
        categoryInput.value,

      date:
        dateInput.value,

      memo:
        memoInput.value.trim()

    });

  }

  saveExpenses();

  renderExpenses();

  clearForm();

}

function clearForm() {

  amountInput.value = "";
  memoInput.value = "";
  dateInput.value = getTodayString();

}

function startEdit(id) {

  const expense =
    expenses.find(
      e => e.id === id
    );

  if (!expense) return;

  editingId = id;

  amountInput.value =
    expense.amount;

  categoryInput.value =
    expense.category;

  dateInput.value =
    expense.date;

  memoInput.value =
    expense.memo;

  addButton.textContent =
    "✓ 編集内容を保存";

  cancelButton.style.display =
    "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

function cancelEdit() {

  editingId = null;

  addButton.textContent =
    "＋ 支出を追加";

  cancelButton.style.display =
    "none";

  clearForm();

}

function deleteExpense(id) {

  const expense =
    expenses.find(
      e => e.id === id
    );

  if (!expense) return;

  const ok =
    confirm(
      `${formatYen(expense.amount)}の支出を削除しますか？`
    );

  if (!ok) return;

  expenses =
    expenses.filter(
      e => e.id !== id
    );

  saveExpenses();

  renderExpenses();

}

function changeMonth(amount) {

  selectedMonth =
    new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth() + amount,
      1
    );

  renderExpenses();

}

addButton.addEventListener(
  "click",
  addExpense
);

cancelButton.addEventListener(
  "click",
  cancelEdit
);

prevMonth.addEventListener(
  "click",
  () => changeMonth(-1)
);

nextMonth.addEventListener(
  "click",
  () => changeMonth(1)
);

searchInput.addEventListener(
  "input",
  renderExpenses
);

filterCategory.addEventListener(
  "change",
  renderExpenses
);

memoInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      addExpense();
    }

  }
);

renderExpenses();

</script>

</body>
</html>

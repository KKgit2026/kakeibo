<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: #111827;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 12px 32px;
}

h1 {
  margin: 4px 0 16px;
  text-align: center;
  font-size: 25px;
}

/* 月切り替え */
.month-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.month-button {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 10px;
  background: #1f2937;
  color: #fff;
  font-size: 22px;
}

.month-title {
  flex: 1;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

/* サマリー */
.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.summary-card {
  padding: 13px 7px;
  border-radius: 14px;
  background: #1f2937;
  text-align: center;
}

.summary-label {
  color: #9ca3af;
  font-size: 11px;
}

.summary-amount {
  margin-top: 4px;
  font-size: 18px;
  font-weight: bold;
}

.balance-card {
  grid-column: 1 / -1;
  padding: 18px;
}

.balance-card .summary-amount {
  font-size: 29px;
}

/* フォーム */
.form {
  margin-bottom: 12px;
  padding: 16px;
  border-radius: 16px;
  background: #1f2937;
}

.section-title {
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: bold;
}

.type-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.type-button {
  padding: 11px;
  border: 2px solid #374151;
  border-radius: 10px;
  background: #111827;
  color: #9ca3af;
  font-size: 15px;
  font-weight: bold;
}

.type-button.active {
  border-color: #3b82f6;
  color: #fff;
  background: #1e3a5f;
}

.field {
  margin-bottom: 10px;
}

.field label {
  display: block;
  margin-bottom: 4px;
  color: #9ca3af;
  font-size: 12px;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #374151;
  border-radius: 10px;
  outline: none;
  background: #111827;
  color: #fff;
  font-size: 16px;
}

input:focus,
select:focus {
  border-color: #3b82f6;
}

.add-button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
}

.cancel-button {
  display: none;
  width: 100%;
  margin-top: 8px;
  padding: 11px;
  border: none;
  border-radius: 10px;
  background: #374151;
  color: #fff;
  font-size: 15px;
}

.save-status {
  min-height: 18px;
  margin-top: 8px;
  color: #6ee7b7;
  font-size: 12px;
  text-align: center;
}

/* カテゴリ */
.category-summary {
  margin-bottom: 12px;
  padding: 15px;
  border-radius: 16px;
  background: #1f2937;
}

.category-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid #374151;
  font-size: 14px;
}

.category-row:last-child {
  border-bottom: none;
}

/* 検索 */
.filter-box {
  margin-bottom: 12px;
  padding: 14px;
  border-radius: 16px;
  background: #1f2937;
}

.filter-row {
  display: flex;
  gap: 8px;
}

.filter-row input {
  flex: 1;
}

.filter-row select {
  width: 120px;
}

/* 一覧 */
.list {
  padding: 16px;
  border-radius: 16px;
  background: #1f2937;
}

.expense {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  border-bottom: 1px solid #374151;
}

.expense:last-child {
  border-bottom: none;
}

.expense-info {
  flex: 1;
  min-width: 0;
}

.expense-category {
  font-size: 14px;
  font-weight: bold;
}

.expense-detail {
  margin-top: 3px;
  color: #9ca3af;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.expense-amount {
  font-size: 15px;
  font-weight: bold;
  white-space: nowrap;
}

.income-amount {
  color: #6ee7b7;
}

.expense-amount-red {
  color: #fca5a5;
}

.action-button {
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: #374151;
  color: #fff;
  font-size: 14px;
}

.delete-button {
  color: #fca5a5;
}

.empty {
  padding: 24px 10px;
  color: #9ca3af;
  text-align: center;
  font-size: 13px;
}

.count {
  margin-top: 10px;
  color: #9ca3af;
  text-align: right;
  font-size: 11px;
}

@media (max-width: 380px) {
  .app {
    padding: 12px 9px 25px;
  }

  .summary-amount {
    font-size: 16px;
  }

  .balance-card .summary-amount {
    font-size: 27px;
  }

  .filter-row select {
    width: 105px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>💰 家計簿</h1>

  <!-- 月切り替え -->
  <div class="month-bar">
    <button class="month-button" id="prevMonth">‹</button>

    <div class="month-title" id="monthTitle"></div>

    <button class="month-button" id="nextMonth">›</button>
  </div>

  <!-- サマリー -->
  <div class="summary-grid">

    <div class="summary-card">
      <div class="summary-label">収入</div>
      <div class="summary-amount income-amount" id="incomeTotal">
        ¥0
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">支出</div>
      <div class="summary-amount expense-amount-red" id="expenseTotal">
        ¥0
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">件数</div>
      <div class="summary-amount" id="entryCount">
        0件
      </div>
    </div>

    <div class="summary-card balance-card">
      <div class="summary-label">残高</div>
      <div class="summary-amount" id="balance">
        ¥0
      </div>
    </div>

  </div>

  <!-- 入力 -->
  <div class="form">

    <div class="section-title" id="formTitle">
      支出を追加
    </div>

    <div class="type-buttons">

      <button
        class="type-button active"
        id="expenseTypeButton"
      >
        💸 支出
      </button>

      <button
        class="type-button"
        id="incomeTypeButton"
      >
        💵 収入
      </button>

    </div>

    <div class="field">
      <label>金額</label>

      <input
        id="amount"
        type="number"
        inputmode="numeric"
        placeholder="例：1280"
      >
    </div>

    <div class="field" id="categoryField">

      <label>カテゴリ</label>

      <select id="category">

        <option value="食費">🍚 食費</option>
        <option value="日用品">🛒 日用品</option>
        <option value="交通費">🚃 交通費</option>
        <option value="趣味">🎮 趣味</option>
        <option value="光熱費">💡 光熱費</option>
        <option value="通信費">📱 通信費</option>
        <option value="その他">📦 その他</option>

      </select>

    </div>

    <div class="field">

      <label>日付</label>

      <input
        id="date"
        type="date"
      >

    </div>

    <div class="field">

      <label>メモ</label>

      <input
        id="memo"
        type="text"
        placeholder="例：スーパー"
      >

    </div>

    <button
      class="add-button"
      id="addButton"
    >
      ＋ 支出を追加
    </button>

    <button
      class="cancel-button"
      id="cancelButton"
    >
      編集をキャンセル
    </button>

    <div
      class="save-status"
      id="saveStatus"
    ></div>

  </div>

  <!-- カテゴリ集計 -->
  <div class="category-summary">

    <div class="section-title">
      📊 カテゴリ別支出
    </div>

    <div id="categorySummary"></div>

  </div>

  <!-- 検索 -->
  <div class="filter-box">

    <div class="section-title">
      🔎 検索・絞り込み
    </div>

    <div class="filter-row">

      <input
        id="search"
        type="search"
        placeholder="メモやカテゴリを検索"
      >

      <select id="filterCategory">

        <option value="すべて">
          すべて
        </option>

        <option value="食費">食費</option>
        <option value="日用品">日用品</option>
        <option value="交通費">交通費</option>
        <option value="趣味">趣味</option>
        <option value="光熱費">光熱費</option>
        <option value="通信費">通信費</option>
        <option value="その他">その他</option>

      </select>

    </div>

  </div>

  <!-- 一覧 -->
  <div class="list">

    <div class="section-title">
      📋 明細
    </div>

    <div id="entryList"></div>

    <div
      class="count"
      id="count"
    ></div>

  </div>

</div>

<script>

const STORAGE_KEY =
  "myHouseholdExpenses";

/* 要素 */
const amountInput =
  document.getElementById("amount");

const categoryInput =
  document.getElementById("category");

const dateInput =
  document.getElementById("date");

const memoInput =
  document.getElementById("memo");

const addButton =
  document.getElementById("addButton");

const cancelButton =
  document.getElementById("cancelButton");

const expenseTypeButton =
  document.getElementById("expenseTypeButton");

const incomeTypeButton =
  document.getElementById("incomeTypeButton");

const categoryField =
  document.getElementById("categoryField");

const entryList =
  document.getElementById("entryList");

const incomeTotal =
  document.getElementById("incomeTotal");

const expenseTotal =
  document.getElementById("expenseTotal");

const balance =
  document.getElementById("balance");

const entryCount =
  document.getElementById("entryCount");

const categorySummary =
  document.getElementById("categorySummary");

const saveStatus =
  document.getElementById("saveStatus");

const monthTitle =
  document.getElementById("monthTitle");

const searchInput =
  document.getElementById("search");

const filterCategory =
  document.getElementById("filterCategory");

const countElement =
  document.getElementById("count");

const prevMonth =
  document.getElementById("prevMonth");

const nextMonth =
  document.getElementById("nextMonth");

/* データ */
let entries =
  JSON.parse(
    localStorage.getItem(
      STORAGE_KEY
    )
  ) || [];

/*
  今までの支出データには type がないため、
  type がないものは支出として扱う。
*/
entries = entries.map(
  entry => ({
    ...entry,
    type:
      entry.type || "expense"
  })
);

let selectedMonth =
  new Date();

let editingId =
  null;

let currentType =
  "expense";

const categories = [
  "食費",
  "日用品",
  "交通費",
  "趣味",
  "光熱費",
  "通信費",
  "その他"
];

/* 今日 */
function getTodayString() {

  const d =
    new Date();

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2, "0")
  );
}

dateInput.value =
  getTodayString();

/* 金額 */
function formatYen(value) {

  return (
    "¥" +
    Number(value)
      .toLocaleString(
        "ja-JP"
      )
  );
}

/* 保存 */
function saveEntries() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(entries)
  );

  saveStatus.textContent =
    `✓ 自動保存しました　保存データ：${entries.length}件`;

  setTimeout(
    () => {
      saveStatus.textContent = "";
    },
    2500
  );
}

/* 月キー */
function getMonthKey(date) {

  const d =
    new Date(date);

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth() + 1
    ).padStart(2, "0")
  );
}

/* 選択月 */
function getSelectedMonthKey() {

  return (
    selectedMonth.getFullYear() +
    "-" +
    String(
      selectedMonth.getMonth() + 1
    ).padStart(2, "0")
  );
}

/* 月表示 */
function updateMonthTitle() {

  monthTitle.textContent =
    `${selectedMonth.getFullYear()}年` +
    `${selectedMonth.getMonth() + 1}月`;
}

/* 選択月のデータ */
function getMonthEntries() {

  const key =
    getSelectedMonthKey();

  return entries.filter(
    entry =>
      getMonthKey(
        entry.date
      ) === key
  );
}

/* サマリー */
function updateSummary() {

  const monthEntries =
    getMonthEntries();

  let income = 0;
  let expense = 0;

  monthEntries.forEach(
    entry => {

      if (
        entry.type === "income"
      ) {

        income +=
          Number(entry.amount);

      } else {

        expense +=
          Number(entry.amount);

      }

    }
  );

  incomeTotal.textContent =
    formatYen(income);

  expenseTotal.textContent =
    formatYen(expense);

  balance.textContent =
    formatYen(
      income - expense
    );

  entryCount.textContent =
    monthEntries.length +
    "件";
}

/* カテゴリ */
function updateCategorySummary() {

  const monthEntries =
    getMonthEntries()
      .filter(
        entry =>
          entry.type !== "income"
      );

  const totals = {};

  categories.forEach(
    category => {
      totals[category] = 0;
    }
  );

  monthEntries.forEach(
    entry => {

      if (
        totals[
          entry.category
        ] !== undefined
      ) {

        totals[
          entry.category
        ] +=
          Number(entry.amount);

      }

    }
  );

  categorySummary.innerHTML =
    "";

  const used =
    categories.filter(
      category =>
        totals[category] > 0
    );

  if (
    used.length === 0
  ) {

    categorySummary.innerHTML =
      `<div class="empty">
        この月の支出はありません
      </div>`;

    return;
  }

  used.forEach(
    category => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "category-row";

      row.innerHTML =
        `<span>${category}</span>
         <strong>
           ${formatYen(
             totals[category]
           )}
         </strong>`;

      categorySummary.appendChild(
        row
      );

    }
  );
}

/* フィルター */
function getFilteredEntries() {

  let list =
    getMonthEntries();

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const selectedCategory =
    filterCategory.value;

  if (search) {

    list =
      list.filter(
        entry => {

          const text =
            (
              entry.category +
              " " +
              entry.memo +
              " " +
              entry.date +
              " " +
              (
                entry.type ===
                "income"
                  ? "収入"
                  : "支出"
              )
            )
            .toLowerCase();

          return text.includes(
            search
          );

        }
      );
  }

  if (
    selectedCategory !==
    "すべて"
  ) {

    list =
      list.filter(
        entry =>
          entry.category ===
          selectedCategory
      );

  }

  return list.sort(
    (a, b) =>
      b.date.localeCompare(
        a.date
      ) ||
      b.id - a.id
  );
}

/* 一覧 */
function renderEntries() {

  entryList.innerHTML =
    "";

  const list =
    getFilteredEntries();

  if (
    list.length === 0
  ) {

    entryList.innerHTML =
      `<div class="empty">
        該当するデータはありません
      </div>`;

  }

  list.forEach(
    entry => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "expense";

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "expense-info";

      const category =
        document.createElement(
          "div"
        );

      category.className =
        "expense-category";

      category.textContent =
        entry.type === "income"
          ? "💵 収入"
          : entry.category;

      const detail =
        document.createElement(
          "div"
        );

      detail.className =
        "expense-detail";

      detail.textContent =
        entry.date +
        (
          entry.memo
            ? "　" +
              entry.memo
            : ""
        );

      info.appendChild(
        category
      );

      info.appendChild(
        detail
      );

      const amount =
        document.createElement(
          "div"
        );

      amount.className =
        "expense-amount " +
        (
          entry.type === "income"
            ? "income-amount"
            : "expense-amount-red"
        );

      amount.textContent =
        (
          entry.type === "income"
            ? "+"
            : "-"
        ) +
        formatYen(
          entry.amount
        );

      const editButton =
        document.createElement(
          "button"
        );

      editButton.className =
        "action-button";

      editButton.textContent =
        "✏️";

      editButton.addEventListener(
        "click",
        () =>
          startEdit(entry.id)
      );

      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "action-button delete-button";

      deleteButton.textContent =
        "🗑️";

      deleteButton.addEventListener(
        "click",
        () =>
          deleteEntry(entry.id)
      );

      item.appendChild(
        info
      );

      item.appendChild(
        amount
      );

      item.appendChild(
        editButton
      );

      item.appendChild(
        deleteButton
      );

      entryList.appendChild(
        item
      );

    }
  );

  countElement.textContent =
    `${list.length}件表示 / 保存データ ${entries.length}件`;

  updateSummary();
  updateCategorySummary();
  updateMonthTitle();
}

/* タイプ切り替え */
function setType(type) {

  currentType =
    type;

  if (
    type === "income"
  ) {

    incomeTypeButton.classList.add(
      "active"
    );

    expenseTypeButton.classList.remove(
      "active"
    );

    categoryField.style.display =
      "none";

    document.getElementById(
      "formTitle"
    ).textContent =
      "収入を追加";

    addButton.textContent =
      "＋ 収入を追加";

  } else {

    expenseTypeButton.classList.add(
      "active"
    );

    incomeTypeButton.classList.remove(
      "active"
    );

    categoryField.style.display =
      "block";

    document.getElementById(
      "formTitle"
    ).textContent =
      "支出を追加";

    addButton.textContent =
      "＋ 支出を追加";

  }

}

/* 追加・編集 */
function addEntry() {

  const amount =
    Number(
      amountInput.value
    );

  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "金額を入力してください"
    );

    amountInput.focus();

    return;
  }

  if (
    !dateInput.value
  ) {

    alert(
      "日付を入力してください"
    );

    return;
  }

  if (
    editingId !== null
  ) {

    const entry =
      entries.find(
        e =>
          e.id ===
          editingId
      );

    if (entry) {

      entry.amount =
        amount;

      entry.type =
        currentType;

      entry.category =
        currentType ===
        "income"
          ? "収入"
          : categoryInput.value;

      entry.date =
        dateInput.value;

      entry.memo =
        memoInput.value.trim();

    }

    editingId =
      null;

    cancelButton.style.display =
      "none";

  } else {

    entries.push({

      id:
        Date.now(),

      type:
        currentType,

      amount:
        amount,

      category:
        currentType ===
        "income"
          ? "収入"
          : categoryInput.value,

      date:
        dateInput.value,

      memo:
        memoInput.value.trim()

    });

  }

  saveEntries();

  renderEntries();

  clearForm();

  setType("expense");
}

/* フォームクリア */
function clearForm() {

  amountInput.value =
    "";

  memoInput.value =
    "";

  dateInput.value =
    getTodayString();

}

/* 編集 */
function startEdit(id) {

  const entry =
    entries.find(
      e =>
        e.id === id
    );

  if (!entry) return;

  editingId =
    id;

  amountInput.value =
    entry.amount;

  dateInput.value =
    entry.date;

  memoInput.value =
    entry.memo;

  if (
    entry.type === "income"
  ) {

    setType("income");

  } else {

    setType("expense");

    categoryInput.value =
      entry.category;

  }

  addButton.textContent =
    "✓ 編集内容を保存";

  cancelButton.style.display =
    "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* 編集キャンセル */
function cancelEdit() {

  editingId =
    null;

  cancelButton.style.display =
    "none";

  clearForm();

  setType("expense");
}

/* 削除 */
function deleteEntry(id) {

  const entry =
    entries.find(
      e =>
        e.id === id
    );

  if (!entry) return;

  const ok =
    confirm(
      `${formatYen(entry.amount)}の` +
      `${entry.type === "income"
        ? "収入"
        : "支出"
      }を削除しますか？`
    );

  if (!ok) return;

  entries =
    entries.filter(
      e =>
        e.id !== id
    );

  saveEntries();

  renderEntries();
}

/* 月変更 */
function changeMonth(amount) {

  selectedMonth =
    new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth() +
        amount,
      1
    );

  renderEntries();
}

/* イベント */
expenseTypeButton.addEventListener(
  "click",
  () =>
    setType("expense")
);

incomeTypeButton.addEventListener(
  "click",
  () =>
    setType("income")
);

addButton.addEventListener(
  "click",
  addEntry
);

cancelButton.addEventListener(
  "click",
  cancelEdit
);

prevMonth.addEventListener(
  "click",
  () =>
    changeMonth(-1)
);

nextMonth.addEventListener(
  "click",
  () =>
    changeMonth(1)
);

searchInput.addEventListener(
  "input",
  renderEntries
);

filterCategory.addEventListener(
  "change",
  renderEntries
);

memoInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      addEntry();

    }

  }
);

/* 起動 */
renderEntries();

</script>

</body>
</html>
